name: EarnBridge Build Check

on:
push:
branches:
- main
pull_request:
branches:
- main

jobs:
build:
name: Check application build
runs-on: ubuntu-latest

steps:
  - name: Get source code
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm

  - name: Install dependencies
    run: npm install

  - name: Build EarnBridge
    run: npm run build
